name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Do not set registry-url: setup-node would write an empty
      # _authToken and npm would skip OIDC trusted publishing.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Use latest npm (OIDC trusted publishing)
        run: npm install -g npm@latest

      - name: Verify tag matches package.json
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v${tag} does not match package.json version ${pkg}"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: CI gate
        run: bun run ci

      # Upload before npm publish so a CDN failure can be re-run
      # without a second publish of the same version.
      - name: Upload script bundle
        env:
          WIDGET_S3_ENDPOINT: ${{ secrets.WIDGET_S3_ENDPOINT }}
          WIDGET_S3_BUCKET: ${{ secrets.WIDGET_S3_BUCKET }}
          WIDGET_S3_ACCESS_KEY_ID: ${{ secrets.WIDGET_S3_ACCESS_KEY_ID }}
          WIDGET_S3_SECRET_ACCESS_KEY: ${{ secrets.WIDGET_S3_SECRET_ACCESS_KEY }}
          ZEROPS_API_TOKEN: ${{ secrets.ZEROPS_API_TOKEN }}
          ZEROPS_WIDGET_SERVICE_ID: ${{ secrets.ZEROPS_WIDGET_SERVICE_ID }}
        run: bun scripts/publish-cdn.ts

      - name: Publish to npm
        run: npm publish

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: lint · test · audit · build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run lint

      - name: Typecheck (svelte-check)
        run: bun run check

      - name: Unit tests with coverage
        run: bun run test:coverage

      - name: Enforce pure-module coverage floors
        run: bun run scripts/check-coverage.ts --write-badge

      - name: Upload coverage (lcov)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov
          path: coverage/
          retention-days: 14

      - name: Update coverage badge on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/badges/coverage.json; then
            echo "Coverage badge unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/badges/coverage.json
          git commit -m "chore: update coverage badge"
          git push

      - name: Production build
        run: bun run build

      - name: Dependency audit
        run: bun run audit

      # Official CLI (MIT) — no GITLEAKS_LICENSE. The gitleaks-action@v2+ wrapper
      # requires a paid/free org license key and is awkward for public OSS.
      - name: Secret scan (Gitleaks)
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks version
          ./gitleaks detect --source . --verbose --redact
